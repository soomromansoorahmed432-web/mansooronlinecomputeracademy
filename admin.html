<!DOCTYPE html>
<html>
<head>
<title>Admin - Mansoor Online Academy</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:10px;width:350px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
input{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:10px;background:#0d6efd;color:white;border:none;border-radius:5px;cursor:pointer}
#dashboard{display:none}
</style>
</head>
<body>
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<p>Mansoor Online Academy</p>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg" style="color:red"></p>
<p style="font-size:12px;margin-top:10px">Demo: admin / admin123</p>
</div>

<div class="box" id="dashboard" style="width:600px">
<h2>Welcome Admin!</h2>
<p>Ye aapka Admin Panel hai</p>
<hr>
<h3>Admissions</h3>
<p>Yahan par students ke admission show honge.</p>
<button onclick="location.href='/'">Go to Home</button>
<button onclick="location.href='/login.html'" style="background:green">View Admission Forms</button>
<button onclick="logout()" style="background:#dc3545;margin-top:10px">Logout</button>
</div>

<script>
function login(){
  let u = document.getElementById('user').value;
  let p = document.getElementById('pass').value;
  if(u=="admin" && p=="admin123"){
    document.getElementById('loginBox').style.display="none";
    document.getElementById('dashboard').style.display="block";
  }else{
    document.getElementById('msg').innerText="Wrong username or password!";
  }
}
function logout(){
  document.getElementById('loginBox').style.display="block";
  document.getElementById('dashboard').style.display="none";
}
</script>
</body>
</html>
