<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo-area">
    <img src="LOGO-removebg-preview.png">
    <strong>Mansoor Online Computer Academy</strong>
  </div>

  <button onclick="logout()">Logout</button>
</header>

<main class="dashboard">

  <div class="welcome">
    <h1>Student Dashboard</h1>
    <p id="studentName">Loading...</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>📚 My Courses</h3>
      <p>View your enrolled courses.</p>
    </div>

    <div class="card">
      <h3>📢 Announcements</h3>
      <p>Latest academy announcements.</p>
    </div>

    <div class="card">
      <h3>🎓 My Profile</h3>
      <p>Manage your student information.</p>
    </div>

  </div>

</main>

<script src="app.js"></script>
<script>
loadDashboard();
</script>

</body>
</html>
